name: Android Build & Release CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Environment File
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      # Security: Decode signing key from GitHub Secret if provided
      - name: Prepare Signing Keystore
        id: prepare_keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ] || [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Signing key detected in GitHub Secrets. Decoding..."
            echo "${{ secrets.SIGNING_KEY || secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "No custom SIGNING_KEY secret found. Generating temporary CI signing key for release build..."
            keytool -genkey -v -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "androidci" -keypass "androidci" -dname "CN=BTEB CI, O=AnbuSoft, C=BD"
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug & Release APK and AAB Bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEY_STORE_PASSWORD || 'androidci' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'androidci' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ALIAS || 'BTEBAPP' }}
        run: |
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      # Security: Immediately destroy the keystore file from runner storage
      - name: Secure Cleanup Keystore
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/my-upload-key.jks"
          rm -f app/my-upload-key.jks
          rm -f release.keystore
          echo "Keystore securely removed from runner disk."

      # Security: Generate SHA-256 Checksums for tamper detection
      - name: Generate Security Checksums (SHA-256)
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/ 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab release-artifacts/ 2>/dev/null || true
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt || true
          echo "==== SHA-256 Security Checksums ===="
          cat SHA256SUMS.txt
          cp SHA256SUMS.txt ..

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bteb-result-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bteb-result-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bteb-result-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Security Checksums
        uses: actions/upload-artifact@v4
        with:
          name: bteb-result-checksums
          path: SHA256SUMS.txt
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "BTEB Result & Routine ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎓 BTEB Result & Academic Portal - Release ${{ github.ref_name }}
            
            ### 📦 Downloads & Verification
            Download the official signed APK below. Verify cryptographic integrity with SHA-256 checksums:
            
            ```
            $(cat SHA256SUMS.txt 2>/dev/null || echo "Checksums generated during CI build.")
            ```
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
